name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Find project directory
        id: find
        run: |
          f=$(find . -name settings.gradle.kts -not -path "*/build/*" | head -n 1)
          if [ -z "$f" ]; then echo "settings.gradle.kts не найден"; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug and release APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: >
          gradle assembleDebug assembleRelease
          -x lintVitalRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease
          -Dorg.gradle.jvmargs=-Xmx4g
          --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp "${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" dist/Tanix-Launcher-debug.apk
          cp "${{ steps.find.outputs.dir }}/app/build/outputs/apk/release/app-release.apk" dist/Tanix-Launcher-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tanix-Launcher-APK
          path: dist/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
