
        name: Android APK Build
on: push: branches: - main - master pull_request: workflow_dispatch:
permissions: contents: read
concurrency: group: android-build-${{ github.ref }} cancel-in-progress: true
jobs: build: name: Build and verify APK runs-on: ubuntu-latest timeout-minutes: 45
steps:
  - name: Checkout repository
    uses: actions/checkout@v6

  - name: Set up Java
    uses: actions/setup-java@v6
    with:
      distribution: temurin
      java-version: '17'
      cache: gradle

  - name: Validate Gradle Wrapper
    uses: gradle/actions/wrapper-validation@v6

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v6

  - name: Check project structure
    shell: bash
    run: |
      set -euo pipefail

      if [[ ! -f "gradlew" ]]; then
        echo "::error::Gradle Wrapper not found in repository root."
        exit 1
      fi

      if [[ ! -f "settings.gradle" && ! -f "settings.gradle.kts" ]]; then
        echo "::error::Gradle settings file not found in repository root."
        exit 1
      fi

      chmod +x gradlew

  - name: Run unit tests
    run: ./gradlew test --no-daemon --stacktrace

  - name: Run Android lint
    run: ./gradlew lint --no-daemon --stacktrace

  - name: Build debug APK
    run: ./gradlew assembleDebug --no-daemon --stacktrace

  - name: Verify APK output
    shell: bash
    run: |
      set -euo pipefail

      mapfile -t APK_FILES < <(
        find . -type f \
          -path '*/build/outputs/apk/*' \
          -name '*.apk' \
          -not -path '*/build/intermediates/*'
      )

      if [[ ${#APK_FILES[@]} -eq 0 ]]; then
        echo "::error::Build succeeded but no APK was found."
        exit 1
      fi

      for apk in "${APK_FILES[@]}"; do
        echo "Found APK: $apk"
        ls -lh "$apk"
      done

  - name: Upload APK artifacts
    uses: actions/upload-artifact@v4
    with:
      name: android-debug-apk-${{ github.run_number }}
      path: |
        **/build/outputs/apk/**/*.apk
        !**/build/intermediates/**
      if-no-files-found: error
      compression-level: 0
      retention-days: 14

  - name: Upload test and lint reports
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: android-build-reports-${{ github.run_number }}
      path: |
        **/build/reports/tests/**
        **/build/reports/lint-results*
      if-no-files-found: ignore
      retention-days: 7  
